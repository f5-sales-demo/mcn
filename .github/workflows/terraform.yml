---
name: Terraform

# Config-validity + plan-test gate for the complete XC, Azure, AWS, libvirt, and
# Docker showcase. CI runs without live credentials and does not perform an apply:
#
#   - The Azure providers (azurerm/azuread) require a service principal, which the
#     F5 corporate Entra tenant does not permit provisioning. A live plan/apply
#     against Azure is therefore a local/VPN operation (see CONTRIBUTING.md).
#   - The plan-level tests (tests/*.tftest.hcl) mock every external provider, so
#     they need no credentials. They use command = plan and make no live API call.
on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'coverage/**'
      - 'docs/_includes/terraform/**'
      - 'scripts/sync-terraform-includes.sh'
      - 'tests/test-terraform-includes.sh'
      - 'tests/test-terraform-clean-break.sh'
      - 'tests/test-terraform-version-policy.sh'
      - '.github/workflows/terraform.yml'
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'coverage/**'
      - 'docs/_includes/terraform/**'
      - 'scripts/sync-terraform-includes.sh'
      - 'tests/test-terraform-includes.sh'
      - 'tests/test-terraform-clean-break.sh'
      - 'tests/test-terraform-version-policy.sh'
      - '.github/workflows/terraform.yml'

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: 'true'

jobs:
  validate:
    name: validate
    runs-on: [self-hosted, Linux, X64, mcn, ubuntu-24.04]
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Terraform documentation include sync
        working-directory: .
        run: bash scripts/sync-terraform-includes.sh --check

      - name: Terraform clean-break contract
        working-directory: .
        run: bash tests/test-terraform-clean-break.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Init (no backend; CI has no Azure credentials)
        run: terraform init -input=false -backend=false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Validate
        run: terraform validate -no-color

      - name: Plan-level module tests (all providers mocked)
        run: terraform test

  # SMSv2 coverage-probe validation gate. Credential-free: the numeric-leaf tests mock the
  # xcsh provider, so the provider's own schema validators fire at plan with no XC API call.
  # This job resolves f5-sales-demo/xcsh from the public registry, so it only turns green once
  # the provider version `coverage/smsv2/versions.tf` requires (>= 3.80.0, the
  # release carrying the `x-f5xc-wire-name` contract) is published there. Locally the same tests run
  # against the dev_overrides build via verify.sh.
  coverage-smsv2:
    name: coverage-smsv2
    runs-on: [self-hosted, Linux, X64, mcn, ubuntu-24.04]
    defaults:
      run:
        working-directory: coverage/smsv2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Init (no backend; provider resolved from the registry)
        run: terraform init -input=false -backend=false

      - name: Numeric-validator gate (accept valid bounds + reject out-of-range)
        run: ./verify.sh
